<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy Round 1</title>
<style>
/* ====== RESET & BASE ====== */
*,
*::before,
*::after { box-sizing: border-box; }

:root {
  --accent: #7c5cff;
  --accent-2: #22d3ee;
  --accent-glow: rgba(124, 92, 255, 0.55);
  --glass-bg: rgba(20, 20, 35, 0.55);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  --text: #f5f6ff;
  --text-dim: rgba(245, 246, 255, 0.65);
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 12px;
}

html, body { height: 100%; }

body {
  margin: 0;
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Tahoma, Geneva, Verdana, sans-serif;
  color: var(--text);
  background-image: url('image/1.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(124, 92, 255, 0.35), transparent 55%),
    radial-gradient(circle at 85% 90%, rgba(34, 211, 238, 0.28), transparent 55%),
    linear-gradient(180deg, rgba(5, 5, 15, 0.75), rgba(5, 5, 15, 0.85));
  z-index: -1;
}

/* ====== TITLE ====== */
h1 {
  text-align: center;
  margin: 30px 20px 10px;
  font-weight: 800;
  font-size: clamp(1.8rem, 3.5vw, 2.6rem);
  letter-spacing: 0.02em;
  background: linear-gradient(135deg, #ffffff 0%, #c9c6ff 55%, #9edaff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 4px 30px rgba(124, 92, 255, 0.35);
}

/* ====== SCOREBOARD ====== */
.scoreboard {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin: 24px auto 36px;
  padding: 0 16px;
  flex-wrap: wrap;
}

.team {
  position: relative;
  min-width: 240px;
  padding: 22px 24px 18px;
  border-radius: var(--radius-lg);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: var(--glass-shadow);
  text-align: center;
  overflow: hidden;
  transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}

.team::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(124, 92, 255, 0.6), rgba(34, 211, 238, 0.35), transparent 70%);
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  pointer-events: none;
  opacity: 0.7;
}

.team:hover {
  transform: translateY(-3px);
  border-color: rgba(124, 92, 255, 0.4);
  box-shadow: 0 14px 50px rgba(124, 92, 255, 0.28);
}

.team h3 {
  margin: 0 0 6px;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.score {
  font-size: 2.8rem;
  font-weight: 800;
  line-height: 1;
  margin: 8px 0 18px;
  background: linear-gradient(135deg, #ffffff, #b7b0ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-variant-numeric: tabular-nums;
  transition: transform 0.25s ease;
}

.score.bump {
  transform: scale(1.12);
}

.score-controls {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.score-controls button {
  width: 42px;
  height: 42px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  font-size: 1.15rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}

.score-controls button:hover {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent;
  box-shadow: 0 8px 20px rgba(124, 92, 255, 0.45);
  transform: translateY(-2px);
}

.score-controls button:active {
  transform: translateY(0) scale(0.95);
}

/* ====== GRID (8 колонок) ====== */
.grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 14px;
  padding: 12px;
  justify-items: center;
  max-width: 1180px;
  margin: 0 auto;
}

/* ====== CATEGORY (круглая шапка) ====== */
.category {
  background: var(--glass-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 8px;
  text-align: center;
  font-weight: 700;
  border-radius: 50%;
  font-size: 0.66rem;
  line-height: 1.15;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--text);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  width: 96px;
  height: 96px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--glass-border);
  transition: transform 0.25s ease, border-color 0.25s ease;
}

.category:hover {
  transform: translateY(-2px);
  border-color: rgba(124, 92, 255, 0.5);
}

/* ====== QUESTION BUTTON (круглая) ====== */
.question {
  position: relative;
  width: 96px;
  height: 96px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--glass-border);
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.8rem;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  transition: transform 0.25s cubic-bezier(.2,.9,.3,1.2), box-shadow 0.25s ease, border-color 0.25s ease;
  overflow: hidden;
  z-index: 0;
}

.question.q1 { background-image: url("image/icon1.png"); }
.question.q2 { background-image: url("image/icon2.png"); }
.question.q3 { background-image: url("image/icon3.png"); }
.question.q4 { background-image: url("image/icon4.png"); }

.question::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.65)),
    radial-gradient(circle at 30% 20%, rgba(124,92,255,0.25), transparent 60%);
  border-radius: 50%;
  z-index: 1;
  transition: opacity 0.25s ease;
}

.question span {
  position: relative;
  z-index: 2;
}

.question:hover {
  transform: translateY(-6px) scale(1.06);
  border-color: rgba(124, 92, 255, 0.65);
  box-shadow:
    0 18px 40px rgba(0, 0, 0, 0.55),
    0 0 0 1px rgba(124, 92, 255, 0.35),
    0 0 30px rgba(124, 92, 255, 0.4);
}

.question:hover::before { opacity: 0.85; }

.question.used {
  background: rgba(30, 30, 45, 0.6) !important;
  cursor: not-allowed;
  border-color: rgba(255, 255, 255, 0.06);
  box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7);
  transform: none !important;
}
.question.used::before { background: rgba(0, 0, 0, 0.72); }
.question.used span { opacity: 0.2; }

/* ====== POPUP ====== */
.popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(5, 5, 15, 0.75);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  justify-content: center;
  align-items: center;
  z-index: 100;
  padding: 20px;
  animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.popup-content {
  position: relative;
  background: rgba(18, 18, 32, 0.92);
  border: 1px solid var(--glass-border);
  padding: 32px 30px;
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: var(--radius-lg);
  text-align: center;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(124, 92, 255, 0.25);
  animation: popIn 0.3s cubic-bezier(.2,.9,.3,1.2);
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.92) translateY(15px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

#popupTitle {
  margin: 0 0 4px;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent-2);
}

.timer {
  font-size: 2.6rem;
  font-weight: 800;
  margin: 10px 0 6px;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(135deg, #ffffff, #b7b0ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

#questionText, #answerText {
  font-size: 1.35rem;
  line-height: 1.55;
  color: #fff;
  margin: 18px 0;
}

#answerText { color: #ffe066; }

.answer {
  display: none;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.1);
}

/* Картинка ответа — теперь заметная и не вылезает за экран */
.answer img {
  display: block;
  max-width: 80%;
  max-height: 45vh;
  width: auto;
  height: auto;
  margin: 14px auto 0;
  border-radius: var(--radius-md);
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.12);
}

/* ====== BUTTONS (general) ====== */
button {
  cursor: pointer;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 11px 18px;
  margin: 6px 4px;
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  transition: transform 0.15s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}

button:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(124, 92, 255, 0.5);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
}

button:active { transform: translateY(0) scale(0.98); }

#questionText blockquote,
#answerText blockquote {
  margin: 14px auto;
  padding: 12px 18px;
  border-left: 3px solid var(--accent);
  background: rgba(124, 92, 255, 0.08);
  border-radius: 10px;
  font-style: italic;
  color: #fff;
  text-align: left;
  max-width: 90%;
}

/* Primary action button (Show answer) */
.action-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.action-buttons button {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border: none;
  padding: 12px 22px;
  font-weight: 700;
  box-shadow: 0 10px 25px rgba(124, 92, 255, 0.4);
}

.action-buttons button:hover {
  box-shadow: 0 14px 32px rgba(124, 92, 255, 0.6);
  transform: translateY(-2px);
}

/* Close button — outlined */
.popup-content > button:last-child {
  margin-top: 20px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.2);
  color: var(--text-dim);
  padding: 11px 32px;
}
.popup-content > button:last-child:hover {
  background: rgba(255,255,255,0.06);
  color: #fff;
  border-color: rgba(255,255,255,0.4);
}

/* ====== MUSIC BUTTON ====== */
#playMusicBtn {
  background: linear-gradient(135deg, #9c27b0, #e91e63) !important;
  display: none;
  align-items: center;
  gap: 8px;
}
#playMusicBtn:hover { box-shadow: 0 14px 32px rgba(233, 30, 99, 0.5) !important; }
#playMusicBtn.playing { background: linear-gradient(135deg, #e53935, #b71c1c) !important; }

@keyframes pulse-note {
  0%   { transform: scale(1);   }
  50%  { transform: scale(1.3); }
  100% { transform: scale(1);   }
}
.note-icon { display: inline-block; font-size: 1.2em; }
#playMusicBtn.playing .note-icon { animation: pulse-note 0.6s infinite; }

/* ====== NEXT BUTTON ====== */
.next-wrapper {
  display: flex;
  justify-content: center;
  margin: 40px auto 60px;
  padding: 0 20px;
}

.next-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 16px 44px;
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #fff;
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  box-shadow:
    0 12px 32px rgba(124, 92, 255, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.35);
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.25s cubic-bezier(.2,.9,.3,1.2), box-shadow 0.25s ease;
}

.next-btn::after { content: "→"; font-size: 1.2rem; transition: transform 0.3s ease; }
.next-btn::before {
  content: "";
  position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  transition: left 0.6s ease;
}
.next-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 45px rgba(124, 92, 255, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.45);
}
.next-btn:hover::after { transform: translateX(6px); }
.next-btn:hover::before { left: 100%; }
.next-btn:active { transform: translateY(-1px) scale(0.98); }

/* ====== RESPONSIVE ====== */
@media (max-width: 1000px) {
  .grid {
    max-width: 100%;
    overflow-x: auto;
    grid-template-columns: repeat(8, 100px);
    justify-content: start;
  }
}

@media (max-width: 640px) {
  .scoreboard { gap: 14px; }
  .team { min-width: 160px; padding: 16px; }
  .score { font-size: 2.2rem; }
  .next-btn { padding: 14px 32px; font-size: 0.95rem; }
  #questionText, #answerText { font-size: 1.15rem; }
  .answer img { max-width: 100%; }
}
</style>
</head>
<body>
<h1>Своя игра</h1>

<!-- SCOREBOARD -->
<div class="scoreboard">
  <div class="team">
    <h3 id="team1Name">Team 1</h3>
    <div class="score" id="score1">0</div>
    <div class="score-controls">
      <button onclick="changeScore(1,1)" aria-label="Плюс один">+</button>
      <button onclick="changeScore(1,-1)" aria-label="Минус один">−</button>
    </div>
  </div>
  <div class="team">
    <h3 id="team2Name">Team 2</h3>
    <div class="score" id="score2">0</div>
    <div class="score-controls">
      <button onclick="changeScore(2,1)" aria-label="Плюс один">+</button>
      <button onclick="changeScore(2,-1)" aria-label="Минус один">−</button>
    </div>
  </div>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h2 id="popupTitle"></h2>
    <div class="timer" id="timer">45</div>
    <button onclick="startTimer()">Запустить таймер</button>
    <p id="questionText">Question text</p>

    <div class="action-buttons">
      <button id="playMusicBtn" onclick="toggleMusic()">
        <span class="note-icon">🎵</span> <span id="musicBtnLabel">Play Music</span>
      </button>
      <button onclick="showAnswer()">Показать ответ</button>
    </div>

    <!-- Ответ + картинка (появляются вместе по клику) -->
    <div class="answer" id="answer">
      <p id="answerText">Answer text</p>
      <img id="answerImage" src="" alt="Изображение к ответу">
    </div>
    <button onclick="closePopup()">Закрыть</button>
  </div>
</div>

<!-- Hidden audio element -->
<audio id="musicPlayer" preload="none"></audio>

<!-- Next -->
<div class="next-wrapper">
  <a href="round2.html" style="text-decoration:none;">
    <button class="next-btn">Следующий раунд</button>
  </a>
</div>

<script>
// ====== CATEGORIES (8) ======
const categories = [
  "Английский язык",
  "История",
  "Литература",
  "Обществознание",
  "География",
  "Биология",
  "Молдавский язык",
  "Наследие Л.А.Тарасевича"
];

// ====== QUESTIONS (8 наборов по 4 вопроса) ======
// Для каждого вопроса поле image: "путь/к/картинке.jpg"
// Если у вопроса нет image — картинка просто не отобразится.
const questions = [
  // 1. Английский язык
  [
    {category:"Английский язык", number:1,
     question:"Who works in a hospital and treats patients?",
     answer:"A Doctor",
     image:"image/english/doctor.jpg"},
    {category:"Английский язык", number:2,
     question:"Who helps a doctor and takes care of patients?",
     answer:"A Nurse",
     image:"image/english/nurse.jpg"},
    {category:"Английский язык", number:3,
     question:"How much water should an adult drink daily?",
     answer:"2 litres",
     image:"image/english/water.jpg"},
    {category:"Английский язык", number:4,
     question:"How much time do the doctors advise to exercise every day?",
     answer:"30 minutes",
     image:"image/english/exercise.jpg"}
  ],

  // 2. История
  [
    {category:"История", number:1,
     question:"Он появился на свет 25 марта (6 апреля) 1836 года на хуторе Карантин, Тираспольского уезда, Херсонской губернии Российской империи. Название хутора — Карантин — напрямую связано с будущей профессией ученого. Там располагалась пограничная карантинная станция для проверки грузов и изоляции людей, прибывавших из зон распространения инфекций. Отец будущего хирурга служил письмоводителем в Дубоссарской карантинной конторе. Его именем назван Научно-исследовательский институт скорой помощи в г. Москва. Назовите имя и фамилию этого знаменитого человека.",
     answer:"Николай Васильевич Склифосовский.",
     image:"image/history/sklifosovsky.jpg"},
    {category:"История", number:2,
     question:"Процедура первой прививки от оспы состоялась в ночь на 12 (23) октября 1768 года в Царском Селе. Операция проводилась в строжайшей секретности. Императрица понимала огромный риск: если бы она умерла, английского врача Томаса Димсдейла, которого она выписала для проведения процедуры, растерзала бы толпа. Она даже заранее подготовила для него подорожную и почтовых лошадей для побега из страны на случай трагического исхода. С помощью ланцета на её руке сделали несколько надрезов, в которые ввели жидкость из созревших оспенных пузырьков на руке мальчика. Назовите имя императрицы.",
     answer:"Екатерина Вторая.",
     image:"image/history/catherine2.jpg"},
    {category:"История", number:3,
     question:"В 1895 году этот учёный открыл Х-лучи, положив начало новой эпохе в медицинской диагностике. Благодаря этому открытию врачи смогли исследовать внутренние органы и кости человека без хирургического вмешательства. Стал первым лауреатом Нобелевской премии по физике в 1901 году за открытие лучей, изменивших медицину. Назовите фамилию ученого.",
     answer:"Вильгельм Рентген.",
     image:"image/history/roentgen.jpg"},
    {category:"История", number:4,
     question:"Исследования этого человека в Калмыцких степях проходили в 1911 году в рамках масштабной международной экспедиции под руководством нобелевского лауреата Ильи Ильича Мечникова. Главной задачей было исследование механизмов распространения туберкулеза и особенностей иммунитета к нему среди коренного населения. Назовите имя учёного-микробиолога, который внёс значительный вклад в развитие вакцинопрофилактики в России.",
     answer:"Лев Александрович Тарасевич",
     image:"image/history/tarasevich.jpg"}
  ],

  // 3. Литература
  [
    {category:"Литература", number:1,
     question:"Какой писатель-врач по образованию создал цикл «Записки юного врача», основанный на собственном опыте работы молодого доктора в сельской больнице?",
     answer:"Михаил Афанасьевич Булгаков",

// ====== BUILD GRID ======
const grid = document.getElementById("grid");

categories.forEach(cat => {
  const c = document.createElement("div");
  c.className = "category";
  c.textContent = cat;
  grid.appendChild(c);
});

// Team names + scores from localStorage
const team1Name = localStorage.getItem("team1Name") || "Team 1";
const team2Name = localStorage.getItem("team2Name") || "Team 2";
document.getElementById("team1Name").textContent = team1Name;
document.getElementById("team2Name").textContent = team2Name;

// Question cells: 4 строки × 8 категорий
for (let i = 0; i < 4; i++) {
  categories.forEach((cat, ci) => {
    const q = document.createElement("div");
    q.className = "question q" + (i + 1);
    q.innerHTML = `<span>${i + 1}</span>`;
    q.onclick = () => openQuestion(q, questions[ci][i]);
    grid.appendChild(q);
  });
}

// ====== SCORE ======
let score1 = Number(localStorage.getItem("score1")) || 0;
let score2 = Number(localStorage.getItem("score2")) || 0;
document.getElementById("score1").textContent = score1;
document.getElementById("score2").textContent = score2;

function changeScore(team, delta) {
  const el = document.getElementById("score" + team);
  if (team === 1) {
    score1 += delta;
    el.textContent = score1;
    localStorage.setItem("score1", score1);
  } else {
    score2 += delta;
    el.textContent = score2;
    localStorage.setItem("score2", score2);
  }
  el.classList.add("bump");
  setTimeout(() => el.classList.remove("bump"), 220);
}

// ====== TIMER ======
let timerInterval;
let timeLeft = 45;

// ====== MUSIC ======
const musicPlayer = document.getElementById("musicPlayer");

function toggleMusic() {
  const btn = document.getElementById("playMusicBtn");
  const label = document.getElementById("musicBtnLabel");

  if (musicPlayer.paused) {
    musicPlayer.play();
    btn.classList.add("playing");
    label.textContent = "Stop Music";
  } else {
    musicPlayer.pause();
    musicPlayer.currentTime = 0;
    btn.classList.remove("playing");
    label.textContent = "Play Music";
  }
}

function stopMusic() {
  musicPlayer.pause();
  musicPlayer.currentTime = 0;
  const btn = document.getElementById("playMusicBtn");
  const label = document.getElementById("musicBtnLabel");
  if (btn) {
    btn.classList.remove("playing");
    label.textContent = "Play Music";
  }
}

// ====== POPUP ======
function openQuestion(el, data) {
  if (el.classList.contains("used")) return;
  el.classList.add("used");

  document.getElementById("popupTitle").textContent =
    `${data.category} – Вопрос ${data.number}`;
  document.getElementById("questionText").innerHTML = data.question;
  document.getElementById("answerText").innerHTML = data.answer;

  // Картинка ответа — задаём сразу, но она спрятана внутри .answer
  const img = document.getElementById("answerImage");
  if (data.image) {
    img.src = data.image;
    img.style.display = "block";
    // Если картинка не загрузилась — прячем, чтобы не было "сломанной" иконки
    img.onerror = () => { img.style.display = "none"; };
    img.onload  = () => { img.style.display = "block"; };
  } else {
    img.removeAttribute("src");
    img.style.display = "none";
  }

  document.getElementById("answer").style.display = "none";
  document.getElementById("timer").textContent = "45";
  timeLeft = 45;

  const playBtn = document.getElementById("playMusicBtn");
  if (data.audio) {
    musicPlayer.src = data.audio;
    musicPlayer.load();
    playBtn.style.display = "inline-flex";
    playBtn.classList.remove("playing");
    document.getElementById("musicBtnLabel").textContent = "Play Music";
  } else {
    playBtn.style.display = "none";
    stopMusic();
  }

  document.getElementById("popup").style.display = "flex";
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 45;
  document.getElementById("timer").textContent = timeLeft;
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById("timer").textContent = timeLeft;
    if (timeLeft <= 0) clearInterval(timerInterval);
  }, 1000);
}

function showAnswer() {
  document.getElementById("answer").style.display = "block";
}

function closePopup() {
  clearInterval(timerInterval);
  stopMusic();
  document.getElementById("popup").style.display = "none";
}
</script>
